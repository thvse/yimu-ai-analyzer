name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持在 GitHub 页面上点击按钮手动触发

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YimuAiAnalyzer-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: "一木AI账本助手 v1.5.0 (彻底修复字段大小写解析与转账支持)"
          body: |
            ### 📱 一木AI账本助手 v1.5.0 (重磅修复版)
            - 🎯 **彻底解决字段解析问题**：修复 SQLite 字段名全小写导致的列名大小写匹配失败问题，账户名称、真实余额、收支流水、转账记录全面恢复正常显示！
            - 💸 **转账记录完美支持**：同时合并读取 bill 流水与 transfer 转账表，完整呈现资金变动
            - 📂 **支持系统文件选择器 (SAF)**：支持直接手动挑选手机中任意目录下的 .zip 备份包
            - 🔑 **签名保持完全一致**：使用内置 fixedSign 证书，支持直接覆盖更新！
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
