name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持在 GitHub 页面上点击按钮手动触发

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YimuAiAnalyzer-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "一木AI账本助手 v1.2.0 (锁定永久固定签名)"
          body: |
            ### 📱 一木AI账本助手 v1.2.0 (永久签名锁定版)
            - 🔑 **锁定永久签名**：内置项目固定签名证书，后续所有更新均保持同一签名，永不冲突！
            - 🌟 **小米 MiMo 全模态大模型**：一键预设接入，支持 mimo-v2.6 全模态
            - 📸 **图片/小票视觉沟通**：相册选图自动识别金额与一木记账分类
            - 🎙️ **语音输入与播报**：支持麦克风语音转文字 (STT) 及 AI 回复自动语音朗读 (TTS)
            - 🔐 **一木记账本地解密**：WinZip AES-256 安全解析 Custom.db
            
            ⚠️ **注意**：因前期未锁定签名导致旧版每次编译签名不同，安装此版本前请先卸载旧版。从本版本（v1.2.0）开始，后续所有版本均可直接无缝覆盖更新！
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
