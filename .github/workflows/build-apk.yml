name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持在 GitHub 页面上点击按钮手动触发

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YimuAiAnalyzer-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: "一木AI账本助手 v1.4.0 (支持手动挑选备份文件与多目录扫描)"
          body: |
            ### 📱 一木AI账本助手 v1.4.0
            - 📂 **支持系统文件选择器 (SAF)**：支持直接手动挑选手机中任何路径下的 .zip 备份包（Download、Documents、微信等），彻底解决因路径不一致读取旧备份的问题！
            - 🔍 **多目录全盘扫描**：自动检索 Documents、Download 及根目录下一木记账的所有备份，智能选取最新修改的文件
            - 🏷️ **清晰状态展示**：在主界面清晰展示当前正在读取的备份文件名及文件修改时间，账单笔数一目了然
            - 🛡️ **安全缓存清理**：解密前彻底清空旧数据库临时文件与 WAL 缓存，杜绝数据残留与脏读
            - 🔑 **签名保持完全一致**：使用内置 fixedSign 证书，支持直接覆盖更新！
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
