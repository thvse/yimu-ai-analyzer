name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持在 GitHub 页面上点击按钮手动触发

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build APKs (Release & Debug)
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YimuAiAnalyzer-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.0
          name: "一木AI账本助手 v1.7.0 (AI直接记账入库+重新分类+全部分类矩阵+现代极速性能)"
          body: |
            ### 📱 一木AI账本助手 v1.7.0 (重磅智能交互升级)
            - ⚡ **AI 对话直接新增记账入库**：对 AI 说“午饭微信付了25”、“记一笔支付宝18打车”，AI 智能提取字段并提供【一键写入一木账本】，直连写入 SQLite 数据库并同步扣减账户余额与更新结余！
            - 🔄 **AI 对话与手动一键重新分类**：既可以对 AI 说“把刚才那笔红包改成餐饮”，也可以在首页账单列表上直接点击分类标签一键切换分类！
            - 📁 **展示一木记账所有系统分类（10大类/66子类）**：新增“全部系统分类”全景矩阵，完整呈现食品餐饮、购物消费、居家生活、出行交通等全部 10 大分类和 66 个子分类树状层级及历史消费！
            - 🚀 **现代 UI 与 120Hz 极速性能优化**：四宫格现代质感指标卡片，提供经过编译器优化的 Release 高性能原生版本，滑动与过渡极其丝滑！
            - 🔑 **签名保持完全一致**：继续保持 fixedSign 固定签名，直接下载覆盖安装即可，数据与配置无缝保留！
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
