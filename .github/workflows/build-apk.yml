name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持在 GitHub 页面上点击按钮手动触发

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YimuAiAnalyzer-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "一木AI账本助手 v1.3.0 (资产与负债全景透视版)"
          body: |
            ### 📱 一木AI账本助手 v1.3.0 (全新资产看板)
            - 💰 **资产与负债全景透视**：全新支持【个人净资产】看板，清晰展示各大资产账户分布（微信、支付宝、银行卡、投资、借贷欠款）
            - 💡 **智能状态适配**：即使当前账本收支流水为 0 笔，依然能完整分析净资产与负债结构，解决“全部显示0”的问题
            - 🤖 **AI 深度资产诊断**：将资产负债比、应急备用金与还款优化策略深度融入小米 MiMo AI 顾问上下文
            - 🔑 **签名保持完全一致**：使用内置 fixedSign 证书，支持从 v1.2.0 直接无缝覆盖更新安装！
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
