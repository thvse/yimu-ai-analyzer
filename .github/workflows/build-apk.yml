name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持在 GitHub 页面上点击按钮手动触发

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YimuAiAnalyzer-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.0
          name: "一木AI账本助手 v1.6.0 (彻底整改：原生Markdown渲染+丝滑动效+全维分类透视)"
          body: |
            ### 📱 一木AI账本助手 v1.6.0 (全面整改完善版)
            - 📑 **优雅的原生 Markdown 渲染**：全面支持 AI 财务分析报告中的标题、对比表格、引用块(>)、分割线、列表及加粗语法，排版极其专业美观！
            - 🎯 **彻底修正分类与收支判定**：重构一木记账收支归属算法（系统分类9=收入，1~8与99=支出），总支出、总收入、结余计算恢复 100% 准确，彻底告别“3笔流水总支出为0”！
            - 📊 **全维分类透视仪表盘**：新增支出与收入双维度切换、彩色占比色条、各分类笔数与金额进度条、资产负债卡片平滑折叠！
            - ⚡ **丝滑高帧率过渡动效**：底栏切换全面接入 AnimatedContent 水平平滑滑动与渐变，AI 思考状态呈现呼吸脉冲动效，告别生硬卡顿！
            - 🔑 **签名保持完全一致**：使用固定 debug.keystore，可直接覆盖更新，无须卸载旧版！
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
